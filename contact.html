<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Send me a message</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <main class="contact-container">

        <h1>Send me a message</h1>

        <p class="contact-intro">
            Fill in the form below and I will get back to you as soon as possible.
        </p>

        <form
    class="contact-form"
    action="https://formspree.io/f/xwlkbdrv"
    method="POST"
>
    <div class="contact-name-row">

        <label>
            <span>First name</span>
            <input
                type="text"
                name="first_name"
                autocomplete="given-name"
                placeholder="Your first name"
                required
            >
        </label>

        <label>
            <span>Last name</span>
            <input
                type="text"
                name="last_name"
                autocomplete="family-name"
                placeholder="Your last name"
                required
            >
        </label>

    </div>

    <label>
        <span>Email address</span>
        <input
            type="email"
            name="email"
            autocomplete="email"
            placeholder="yourname@example.com"
            required
        >
    </label>

    <label>
        <span>Message</span>
        <textarea
            name="message"
            rows="7"
            maxlength="3000"
            placeholder="Write your message here..."
            required
        ></textarea>
    </label>

    <button type="submit">Send message</button>

    <p class="contact-privacy">
        Your email address will only be used to reply to your message.
    </p>
</form>

        <a href="index.html" class="back-link">← Back to home page</a>

    </main>

</body>
</html>
